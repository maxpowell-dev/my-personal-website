  <main id="main" class="page">
    <section class="panel">
      <h1>Contact me</h1>
      <p>Send me a message using the form below, or find my projects on <a href="https://github.com/maxpowell-dev">GitHub</a>.</p>

      <form action="mailto:maxpowellfinland@gmail.com" method="post" enctype="text/plain">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="button" type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Max Powell. Made with HTML and CSS.</p>
